server:
  port: ${PORT:8080}

spring:
  application:
    name: flagship-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flagship}
    username: ${POSTGRES_USER:flagship}
    password: ${POSTGRES_PASSWORD:change_me_in_production}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

flagship:
  security:
    jwt-secret: ${FLAGSHIP_JWT_SECRET:replace-with-32-char-secret-in-prod-env}
    jwt-expiration-ms: 43200000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
